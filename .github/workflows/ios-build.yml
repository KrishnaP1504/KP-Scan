name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub website!

jobs:
  build-ios:
    runs-on: macos-14 # Runs on GitHub's Apple Silicon (M1/M2) Mac runners in the cloud

    steps:
      # 1. Check out your source code from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3. Install JavaScript dependencies
      - name: Install NPM Dependencies
        run: npm install

      # 4. Set up Ruby & CocoaPods
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      # 5. Install iOS Pods
      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      # 6. Build the iOS App with Xcode (Simulator Build - No paid Apple cert needed)
      - name: Build iOS App with Xcode
        run: |
          cd ios
          xcodebuild \
            -workspace kp_scan.xcworkspace \
            -scheme kp_scan \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      # 7. Package the built app into a ZIP file
      - name: Package App
        run: |
          cd ios/build/Build/Products/Release-iphonesimulator/
          zip -r kp_scan_ios_simulator.zip kp_scan.app

      # 8. Upload the build artifact to GitHub
      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kp-scan-ios-build
          path: ios/build/Build/Products/Release-iphonesimulator/kp_scan_ios_simulator.zip
