name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      # 1. Check out source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Select Xcode version explicitly
      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      # 3. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 4. Install JavaScript dependencies
      - name: Install NPM Dependencies
        run: npm install

      # 5. Set up Ruby & CocoaPods
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      # 6. Cache CocoaPods
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      # 7. Install iOS Pods
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      # ============================================
      # BUILD 1: Simulator Build (for testing/verification)
      # ============================================
      - name: Build iOS Simulator App
        run: |
          cd ios
          xcodebuild \
            -workspace kp_scan.xcworkspace \
            -scheme kp_scan \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator \
            -quiet \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Simulator Build
        run: |
          cd ios/build-simulator/Build/Products/Release-iphonesimulator/
          if [ -d "kp_scan.app" ]; then
            zip -r kp_scan_ios_simulator.zip kp_scan.app
            echo "Simulator build successful! Size: $(du -h kp_scan_ios_simulator.zip | cut -f1)"
          else
            echo "ERROR: Simulator kp_scan.app not found!"
            ls -la
            exit 1
          fi

      - name: Upload Simulator Build
        uses: actions/upload-artifact@v4
        with:
          name: kp-scan-simulator-build
          path: ios/build-simulator/Build/Products/Release-iphonesimulator/kp_scan_ios_simulator.zip
          retention-days: 30

      # ============================================
      # BUILD 2: Real iPhone .ipa (for Sideloadly)
      # ============================================
      - name: Build iOS Device App
        run: |
          cd ios
          xcodebuild \
            -workspace kp_scan.xcworkspace \
            -scheme kp_scan \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            -quiet \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package iPhone .ipa
        run: |
          cd ios/build-device/Build/Products/Release-iphoneos/
          if [ -d "kp_scan.app" ]; then
            # Create .ipa structure (Payload/AppName.app)
            mkdir -p Payload
            cp -r kp_scan.app Payload/
            zip -r kp_scan.ipa Payload
            echo "iPhone .ipa build successful! Size: $(du -h kp_scan.ipa | cut -f1)"
          else
            echo "ERROR: Device kp_scan.app not found!"
            ls -la
            exit 1
          fi

      - name: Upload iPhone .ipa
        uses: actions/upload-artifact@v4
        with:
          name: kp-scan-iphone-ipa
          path: ios/build-device/Build/Products/Release-iphoneos/kp_scan.ipa
          retention-days: 30
