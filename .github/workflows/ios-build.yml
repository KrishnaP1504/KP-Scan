name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      # 1. Check out source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Select Xcode version explicitly (prevents version mismatch errors)
      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      # 3. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 4. Install JavaScript dependencies
      - name: Install NPM Dependencies
        run: npm install

      # 5. Set up Ruby & CocoaPods
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      # 6. Cache CocoaPods (saves 3-5 minutes on repeat builds)
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      # 7. Install iOS Pods
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      # 8. Build the iOS App (Simulator - no Apple cert needed)
      - name: Build iOS App with Xcode
        run: |
          cd ios
          xcodebuild \
            -workspace kp_scan.xcworkspace \
            -scheme kp_scan \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -quiet \
            ONLY_ACTIVE_ARCH=NO \
            EXCLUDED_ARCHS='' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      # 9. Package the built app into a ZIP file
      - name: Package App
        run: |
          cd ios/build/Build/Products/Release-iphonesimulator/
          if [ -d "kp_scan.app" ]; then
            zip -r kp_scan_ios_simulator.zip kp_scan.app
            echo "Build successful! App size: $(du -h kp_scan_ios_simulator.zip | cut -f1)"
          else
            echo "ERROR: kp_scan.app not found in build output!"
            ls -la
            exit 1
          fi

      # 10. Upload the build artifact to GitHub
      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kp-scan-ios-build
          path: ios/build/Build/Products/Release-iphonesimulator/kp_scan_ios_simulator.zip
          retention-days: 30
